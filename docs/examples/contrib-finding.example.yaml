observed: >-
  A liveness probe for a free model returned 403 "only available on agentic harnesses" while real
  sessions on the same model succeeded.
evidence: >-
  The same request with the runtime's attribution headers returned 200; without them, 403. Repeated 3 times.
proposal: >-
  Probes must send the same attribution headers the runtime sends; treat 403 with this text as a probe
  artifact, not a dead model.
